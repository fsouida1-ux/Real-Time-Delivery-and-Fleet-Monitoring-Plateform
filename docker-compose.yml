services:

  # --------------------------------------------------------------------
  # PostgreSQL : base transactionnelle ET analytics (une seule instance
  # au MVP — voir section 3 du cahier des charges).
  # --------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: delivery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Volume nommé : les données survivent à un `docker compose down`
      - postgres_data:/var/lib/postgresql/data
      # Nos scripts SQL numérotés (001_, 002_, ...) seront exécutés
      # automatiquement, dans l'ordre alphabétique, au tout premier
      # démarrage du conteneur (dossier vide -> script s'exécute).
      - ./infrastructure/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------
  # Kafka en mode KRaft : pas besoin de Zookeeper séparé (mode moderne,
  # un seul conteneur fait office de broker + contrôleur).
  # --------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: delivery-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      # Deux annonces distinctes : "kafka:19092" pour nos futurs
      # services Python (qui tournent DANS le réseau Docker), et
      # "localhost:9092" pour toi, depuis ta machine (ex: Kafbat en
      # dehors, ou un script de debug local).
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # on crée nos topics explicitement (section 4)
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------------------
  # kafka-init : conteneur "one-shot" -- s'exécute une seule fois pour
  # créer les topics (orders-events, gps-events), puis s'arrête.
  # Respecte la promesse "docker compose up sans intervention manuelle"
  # (section 10) : plus besoin de créer les topics à la main via Kafbat.
  # --------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: delivery-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka:/scripts
    entrypoint: ["/bin/sh", "/scripts/create_topics.sh"]
    restart: "no"

  # --------------------------------------------------------------------
  # Kafbat : interface web pour observer les topics, messages, clés,
  # partitions — indispensable pour déboguer visuellement (section 10).
  # --------------------------------------------------------------------
  kafbat:
    image: ghcr.io/kafbat/kafka-ui:v1.1.0
    container_name: delivery-kafbat
    restart: unless-stopped
    ports:
      - "${KAFBAT_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: delivery-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  metrics-aggregator:
    build:
      context: .
      dockerfile: services/metrics-aggregator/Dockerfile
    container_name: delivery-metrics-aggregator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DRIVER_INACTIVE_MINUTES=${DRIVER_INACTIVE_MINUTES}
      - METRICS_INTERVAL_SECONDS=${METRICS_INTERVAL_SECONDS}
    restart: unless-stopped

  processing-consumer:
    build:
      context: .
      dockerfile: services/processing-consumer/Dockerfile
    container_name: delivery-processing-consumer
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:19092
      - GPS_SPEED_THRESHOLD_KMH=${GPS_SPEED_THRESHOLD_KMH}
    restart: unless-stopped

  db-producer:
    build:
      context: .
      dockerfile: services/db-producer/Dockerfile
    container_name: delivery-db-producer
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:19092
    restart: unless-stopped

  gps-simulator:
    build:
      context: .
      dockerfile: services/gps-simulator/Dockerfile
    container_name: delivery-gps-simulator
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:19092
    restart: unless-stopped
  # --------------------------------------------------------------------
  # Metabase : dashboard BI, se connectera UNIQUEMENT aux vues SQL
  # (reporting/views/), jamais directement aux tables (section 8-9).
  # --------------------------------------------------------------------
  metabase:
    image: metabase/metabase:v0.51.4
    container_name: delivery-metabase
    restart: unless-stopped
    ports:
      - "${METABASE_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db

volumes:
  postgres_data:
  kafka_data:
  metabase_data:
  